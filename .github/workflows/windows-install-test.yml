name: Windows installer validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  installer:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show PowerShell version
        run: '$PSVersionTable | Format-List'

      - name: Run Windows installer integration tests
        run: '& "$PWD/scripts/test_installers_windows.ps1" -RepositoryRoot "$PWD"'
