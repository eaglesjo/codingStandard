name: Windows installer validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  installer:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show PowerShell version
        run: '$PSVersionTable | Format-List'

      - name: Validate PowerShell script syntax
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/scripts/install-domains.ps1",
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }

      - name: Test all domains and languages
        run: |
          $root = Join-Path $env:RUNNER_TEMP "codingstandard-test"
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $root
          New-Item -ItemType Directory -Force $root | Out-Null

          foreach ($language in @("en", "ko")) {
            foreach ($domain in @("common", "llm", "vision", "all")) {
              $target = Join-Path $root "$language-$domain"
              New-Item -ItemType Directory -Force $target | Out-Null
              & "$PWD/scripts/install-domains.ps1" -Target $target -Language $language -Domain $domain -ConflictAction Overwrite
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              if (-not (Test-Path (Join-Path $target "AGENTS.md"))) { throw "AGENTS.md missing for $language/$domain" }
              if ($domain -in @("vision", "all") -and -not (Test-Path (Join-Path $target "VISION/AGENT.md"))) { throw "VISION/AGENT.md missing for $language/$domain" }
              if ($domain -in @("llm", "all") -and -not (Test-Path (Join-Path $target "LLM/AGENT.md"))) { throw "LLM/AGENT.md missing for $language/$domain" }
            }
          }

      - name: Test dry-run
        run: |
          $target = Join-Path $env:RUNNER_TEMP "codingstandard-dryrun"
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $target
          New-Item -ItemType Directory -Force $target | Out-Null
          & "$PWD/scripts/install-domains.ps1" -Target $target -Language en -Domain all -ConflictAction Overwrite -DryRun
          if (Get-ChildItem -Force $target) { throw "Dry-run changed the target directory" }

      - name: Test merge preservation
        run: |
          $target = Join-Path $env:RUNNER_TEMP "codingstandard-merge"
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $target
          New-Item -ItemType Directory -Force $target | Out-Null
          Set-Content -Path (Join-Path $target "AGENTS.md") -Value "# Local rule`r`n`r`n<!-- BEGIN CODINGSTANDARD MANAGED BLOCK -->`r`nold`r`n<!-- END CODINGSTANDARD MANAGED BLOCK -->`r`n" -Encoding utf8
          & "$PWD/scripts/install-domains.ps1" -Target $target -Language en -Domain common -ConflictAction Merge
          $text = Get-Content -Raw (Join-Path $target "AGENTS.md")
          if ($text -notmatch "# Local rule") { throw "Local content was not preserved" }
          if ($text -match "`bold`b") { throw "Managed block was not replaced" }

      - name: Check for forbidden legacy installer
        run: |
          if (Test-Path "$PWD/scripts/install-coding-standard.ps1") { throw "Legacy installer exists" }
          if (Test-Path "$PWD/scripts/install-coding-standard.sh") { throw "Legacy installer exists" }
