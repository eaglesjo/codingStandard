name: Validate codingStandard

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install common test dependencies
        run: python -m pip install --disable-pip-version-check psutil

      - name: Install CPU PyTorch
        run: python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu

      - name: Validate repository
        run: python scripts/validation/validate.py

      - name: Test environment contract
        run: python scripts/development/test_environment.py

      - name: Test installers
        run: python scripts/installers/test_installers.py

      - name: Run LLM CPU memory smoke test
        run: python domains/llm/memory_smoke_test.py --cpu --steps 2 --min-ram-free-gb 0.25

      - name: Run Vision CPU memory smoke test
        run: python domains/vision/memory_smoke_test.py --device cpu --image-size 64 --batch-size 1 --steps 2
