name: Validate codingStandard

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check psutil torch --index-url https://download.pytorch.org/whl/cpu

      - name: Validate repository
        run: python scripts/validate.py

      - name: Test installers
        run: python scripts/test_installers.py

      - name: Run CPU memory smoke test
        run: python LLM/memory_smoke_test.py --cpu --steps 2 --min-ram-free-gb 0.25
