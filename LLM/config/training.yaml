standard_version: 1.1.0

runtime:
  use_environment_profile: true
  memory_smoke_test_required: true
  keep_headroom: true

training:
  validation_required: true
  early_stopping:
    enabled: true
    metric: eval_loss
    mode: min
    patience: 3
    min_delta: 0.0
    restore_best: true
  checkpoint:
    save_best: true
    resume_enabled: true

resources:
  batch_size: auto
gradient_accumulation_steps: auto
  max_seq_length: auto
  num_workers: auto
  mixed_precision: auto
  gradient_checkpointing: auto

reproducibility:
  seed: 42
  record_git_commit: true
  record_environment_profile: true
  record_runtime_config: true
